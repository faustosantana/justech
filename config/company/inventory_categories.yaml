# Categorías oficiales inventario — Fase 3.5
# Jerarquía plana: Inventario → (11 categorías hijas)

schema_version: "2.0"

root: Inventario

official_children:
  - Mobiliario
  - Espejos
  - Lámparas
  - Esculturas
  - Relojería
  - Pinturas
  - Dibujos y litografías
  - Tapisería
  - Cristalería
  - Plata
  - Vajillas

product_behavior:
  description: "Mayoría piezas únicas; algunos productos repetidos (ej. pares)"
  odoo_recommendation:
    tracking: "none"  # serial/lot solo si pieza única requiere trazabilidad individual
    variants: "minimize"  # evitar variantes salvo pares/tallas reales
    duplicate_skus: "per_piece_or_pair"  # un SKU por pieza o por par según catálogo
    import_key: "Código"  # ver product_import_template.csv
  notes:
    - "No cargar productos en Fase 3.5"
    - "Preparar importación Excel/CSV"

legacy_phase3_categories:
  status: deprecated
  note: "Subárbol Fase 3 (Decoración, Iluminación, Mesas, etc.) permanece en BD — no usar para catálogo nuevo"
  action: "Usar solo categorías oficiales bajo Inventario"
