# Métodos de pago — Fase 3.5 (sin pasarelas integradas)

schema_version: "2.0"

configured:
  - name: Efectivo
    journal: CSH1
    type: cash
    direction: inbound_outbound
    gateway: false

  - name: Transferencia
    journal: BNK1
    type: bank
    direction: inbound_outbound
    gateway: false

  - name: Tarjetas
    journal: BNK1
    type: bank
    direction: inbound
    gateway: false
    note: "Registro manual — sin datáfono integrado"

  - name: Link de pago
    journal: BNK1
    type: bank
    direction: inbound
    gateway: false
    status: structure_only
    note: "Línea manual creada — integración pasarela pendiente fase posterior"

  - name: Cheques
    journal: BNK1
    type: bank
    direction: outbound
    method: check_printing

journals:
  - code: CSH1
    name: Efectivo
    type: cash
    created_phase35: true
  - code: BNK1
    name: Bank
    type: bank

restrictions:
  - "No integrar Stripe, PayPal ni pasarelas en DEV"
  - "No instalar módulos payment provider adicionales en esta fase"

sales_modules_required:
  note: "Cotizaciones/facturas/POS requieren sale, stock, point_of_sale — NO instalados (decisión explícita)"
  modules:
    sale: uninstalled
    stock: uninstalled
    point_of_sale: uninstalled
