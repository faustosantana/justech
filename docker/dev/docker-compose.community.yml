# Hellenia — Ambiente DEV (Community — rollback / referencia pre-Enterprise)
include:
  - path: ../lib/traefik-odoo.yaml

services:
  odoo:
    image: odoo:19.0-20260619
    restart: unless-stopped
    labels: *odoo-traefik-labels
    environment:
      - HOST=db
      - USER=${DB_USER}
      - PASSWORD=${DB_PASSWORD}
    volumes:
      - odoo-data:/var/lib/odoo
      - ${ENTERPRISE_PATH}:/mnt/enterprise:ro
      - ${CUSTOM_ADDONS_PATH}:/mnt/custom:ro
      - ${ODOO_CONF_PATH}:/etc/odoo/odoo.conf:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8069/web/login > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - hellenia-dev

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hellenia-dev

volumes:
  odoo-data:
    name: ${COMPOSE_PROJECT_NAME}_odoo-data
  db:
    name: ${COMPOSE_PROJECT_NAME}_db

networks:
  hellenia-dev:
    name: ${COMPOSE_PROJECT_NAME}_default
